<style>
:root{--bg:#f4ecd8;--paper:#fbf6e8;--ink:#3b2f2a;--line:#d8c9a3;--dim:#8a7d64;--red:#c8553d;--gold:#e0a53a;--green:#6fa36a;
  --r0:#3b2f2a;--r1:#2f64cc;--r2:#a87800;--r3:#d2601e;--r4:#2e8b3e;--atk:#c8553d;--def:#2f64cc;--spc:#7a3ac8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
html{font-synthesis:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DotGothic16','MS Gothic','Osaka-Mono',ui-monospace,monospace;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:14px;margin:0;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top>div{display:flex;gap:4px;flex-shrink:0}
.pill{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--gold)}
.brow .pill{padding:4px 8px;font-size:12px}
.pill.plain{cursor:default}
#stage{position:relative;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#bfe0ef}
#cv{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#stage.shake{animation:shake .3s}
#stage.bigshake{animation:shake2 .45s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes shake2{0%,100%{transform:translate(0,0)}15%{transform:translate(-8px,5px)}30%{transform:translate(8px,-5px)}45%{transform:translate(-6px,3px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .45s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#ehp{position:absolute;left:10px;right:10px;top:8px;height:12px;border:2px solid var(--ink);background:var(--paper);border-radius:7px;overflow:hidden}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin:4px 0}
textarea{width:100%;height:80px;font-size:11px;border:1.5px solid var(--ink);border-radius:8px;padding:6px;-webkit-user-select:text;user-select:text}
.rec{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-top:1px dashed var(--line);font-size:12px}
.rec .px{height:20px}
#modal{position:fixed;inset:0;background:rgba(40,30,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#mbox{background:var(--paper);border:3px solid var(--ink);border-radius:12px;max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:12px 14px}
#mbox h2{font-size:17px;margin:0 0 8px}
#mbox .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#mbox .opts .btn{flex:1 1 28%;min-width:28%;word-break:keep-all}
.loot{display:flex;flex-direction:column;gap:2px;font-size:12px;margin:4px 0}
.sb.sb2{border-color:#e0b890;background:#fdf1e2;color:#b0906a}
.sb.sb2 .fill{background:#f5d9b4}
.sb.sb2.ready{border-color:#c8553d;color:var(--ink)}
.sb,.kb{height:44px;font-size:9.5px;line-height:1.15;letter-spacing:-.02em}
.kb small{font-size:8px}
#tip{background:#fff8d8;border:2px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.5}
.cb.empty,.sb.empty{opacity:.35;pointer-events:none;border-style:dashed}
.tabs button{font-size:12px;padding:8px 0;letter-spacing:-.03em}

<style>
/* 投稿サイト（PLiCy）では ページ全体の スクロールが 止められるので、#app の 中で スクロールさせる。上の 帯（ミニ実況）の ぶん すき間も あける */
html.boxed,html.boxed body{height:100%;overflow:hidden!important}
html.boxed #app{position:fixed;top:0;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:calc(10px + var(--boxTop,0px))}
html.boxed #app>*{flex-shrink:0}
html.plicy{--boxTop:92px}
</style>
<script>(function(){ var d=document.documentElement, h=location.hostname, q=location.search;

})();</script>
</head>
